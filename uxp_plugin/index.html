<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Commerce Ready Edit</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="panel-container">
    <!-- Header -->
    <header class="panel-header">
      <div class="brand-badge">
        <img src="assets/logo.png" alt="Path Logo" class="brand-logo-img" />
      </div>
      <div class="brand-text">
        <div class="brand-title">E-Commerce Ready Edit</div>
        <div class="brand-subtitle">A Product By Path</div>
      </div>
    </header>

    <div class="sections-scroll">
      <!-- 1. RESIZE -->
      <section class="accordion-item" id="sec-resize">
        <div class="accordion-header" data-target="body-resize">
          <span class="section-title">RESIZE</span>
          <div class="section-line"></div>
          <span class="chevron down"></span>
        </div>
        <div class="accordion-body" id="body-resize">
          <!-- Marketplace Selector Box -->
          <div class="resize-selector-box">
            <div class="selector-header">
              <label for="selectMarketplaceResize" class="selector-label">Marketplace Preset:</label>
              <div class="toggle-group" title="Process all open documents in Photoshop">
                <span class="toggle-text">ALL</span>
                <label class="switch">
                  <input type="checkbox" id="toggleResizeAll" />
                  <span class="slider"></span>
                </label>
              </div>
            </div>
            <div class="select-wrapper">
              <select id="selectMarketplaceResize" class="marketplace-select">
                <option value="" disabled selected>Select Marketplace...</option>
                <option value="amazon" data-name="Amazon" data-w="2000" data-h="2000" data-dpi="72">Amazon</option>
                <option value="ebay" data-name="eBay" data-w="1600" data-h="1600" data-dpi="72">eBay</option>
                <option value="etsy" data-name="Etsy" data-w="2000" data-h="2000" data-dpi="72">Etsy</option>
                <option value="shopify" data-name="Shopify" data-w="2048" data-h="2048" data-dpi="72">Shopify</option>
                <option value="walmart" data-name="Walmart" data-w="2200" data-h="2200" data-dpi="300">Walmart</option>
                <option value="woocommerce" data-name="WooCommerce" data-w="2000" data-h="2000" data-dpi="72">WooCommerce</option>
                <option value="zalando" data-name="Zalando" data-w="1800" data-h="2600" data-dpi="72">Zalando</option>
                <option value="custom" data-name="Custom" data-w="2000" data-h="2000" data-dpi="72">Custom</option>
              </select>
            </div>

                        <!-- Dynamic Controls: Only visible after selecting a marketplace or custom -->
            <div id="resizeControlsGroup" class="resize-controls-group" style="display: none;">
              <!-- Single Row: Size | Dpi | Just Button -->
              <div class="dimension-row" id="dimensionRow">
                <div class="dim-col dim-col-size">
                  <span class="dim-label">Size</span>
                  <div class="size-inputs-group">
                    <input type="number" id="inputResizeW" value="2000" readonly />
                    <span class="dim-times">&times;</span>
                    <input type="number" id="inputResizeH" value="2000" readonly />
                  </div>
                </div>

                <div class="dim-col dim-col-dpi">
                  <span class="dim-label">Dpi</span>
                  <input type="number" id="inputResizeDpi" value="72" readonly />
                </div>

                <div class="dim-col dim-col-btn">
                  <span class="dim-label-spacer">&nbsp;</span>
                  <button type="button" class="btn-edit-just" id="btnToggleEdit">Edit</button>
                </div>
              </div>

              <!-- Smart Edge Anchor Option Row -->
              <div class="resize-option-row" id="resizeSmartOptionRow">
                <span class="resize-option-label" title="Keep objects touching canvas edges anchored">Smart Edge Anchor</span>
                <div class="toggle-group" title="Detect edge-attached objects and keep them anchored to canvas edge">
                  <span class="toggle-text" id="lblSmartAnchor">OFF</span>
                  <label class="switch">
                    <input type="checkbox" id="toggleSmartAnchor" />
                    <span class="slider"></span>
                  </label>
                </div>
              </div>

              <!-- Apply Resize Button -->
              <button class="action-btn highlight-btn" id="btnApplyResize">
                <span class="btn-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
                </span>
                <span class="btn-label" id="lblApplyResize">Apply Resize</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- 2. BG REMOVE -->
      <section class="accordion-item" id="sec-bg">
        <div class="accordion-header" data-target="body-bg">
          <span class="section-title">BACKGROUNDS</span>
          <div class="section-line"></div>
          <span class="chevron down"></span>
        </div>
        <div class="accordion-body" id="body-bg">
          <div class="action-row">
            <button class="action-btn flex-1" id="btnBgRemove">
              <span class="btn-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
              </span>
              <span class="btn-label">BG Remove</span>
            </button>
            <div class="toggle-group" title="Process all open documents in Photoshop">
              <span class="toggle-text">ALL</span>
              <label class="switch">
                <input type="checkbox" id="toggleBgRemoveAll" />
                <span class="slider"></span>
              </label>
            </div>
          </div>

          <div class="bg-options-row">
            <button type="button" class="action-btn bg-choice-btn" id="btnBgWhite">
              <span class="btn-label-center">White</span>
            </button>
            <button type="button" class="action-btn bg-choice-btn" id="btnBgCustom">
              <span class="btn-label-center">Custom</span>
            </button>
            <button type="button" class="action-btn bg-choice-btn" id="btnBgUpload">
              <span class="btn-label-center">Upload Image</span>
            </button>
          </div>

          <!-- Custom Color Picker Drawer (Expands when Custom is clicked) -->
          <div id="customColorBox" class="custom-color-box" style="display: none;">
            <div class="custom-color-row">
              
              <input type="text" id="hexBgCustom" value="#FFFFFF" placeholder="#FFFFFF" maxlength="7" class="hex-color-input" />
              <button type="button" class="btn-apply-color" id="btnApplyCustomColor">Apply</button>
            </div>
          </div>
        </div>
      </section>


      <!-- 3. EDITING ADJUSTMENT -->
      <section class="accordion-item" id="sec-adjustment">
        <div class="accordion-header" data-target="body-adjustment">
          <span class="section-title">EDITING ADJUSTMENT</span>
          <div class="section-line"></div>
          <span class="chevron down"></span>
        </div>
        <div class="accordion-body" id="body-adjustment">
          <!-- Wrinkle on Clothing -->
          <button type="button" class="action-btn" id="btnWrinkleClothing">
            <span class="btn-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path><line x1="16" y1="8" x2="2" y2="22"></line><line x1="17.5" y1="15" x2="9" y2="15"></line></svg>
            </span>
            <span class="btn-label">Wrinkle on clothing</span>
            <span class="btn-chevron" id="wrinkleChevron"></span>
          </button>

          <!-- Wrinkle Options Drawer (Dropdown) -->
          <div id="wrinkleOptionsBox" class="custom-scsm-box drawer-mb" style="display: none;">
            <div class="drawer-content">
              <!-- Row 1: Dropdown -->
              <div class="custom-select-wrap">
                <select id="selectWrinkleMethod" class="custom-select select-compact">
                  <option value="fs" selected>Frequency Separation</option>
                  <option value="dnb">Dodge and Burn (D&B)</option>
                  <option value="evoto">Save for Evoto (JPG)</option>
                </select>
              </div>
              <!-- Row 2: ALL toggle + Apply button -->
              <div class="drawer-row">
                <div class="toggle-group" title="Process all open documents in Photoshop">
                  <span class="toggle-text">ALL</span>
                  <label class="switch">
                    <input type="checkbox" id="toggleWrinkleAll" />
                    <span class="slider"></span>
                  </label>
                </div>
                <button type="button" class="btn-apply-scsm" id="btnApplyWrinkle" style="flex: 1;">Apply</button>
              </div>
            </div>
          </div>

          <!-- Shadow -->
          <button type="button" class="action-btn" id="btnShadow">
            <span class="btn-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="17" rx="9" ry="4"></ellipse><circle cx="12" cy="8" r="5"></circle></svg>
            </span>
            <span class="btn-label" id="lblShadow">Shadow</span>
            <span class="btn-chevron" id="shadowChevron"></span>
          </button>

          <!-- Shadow Options Drawer (Dropdown) -->
          <div id="shadowOptionsBox" class="custom-scsm-box drawer-mb" style="display: none;">
            <div class="drawer-content">
              <!-- Row 1: Dropdown -->
              <div class="custom-select-wrap">
                <select id="selectShadowMethod" class="custom-select select-compact">
                  <option value="drop" selected>Drop Shadow</option>
                  <option value="natural">Natural Shadow</option>
                  <option value="existing">Existing Shadow</option>
                  <option value="cast">Cast Shadow</option>
                </select>
              </div>
              <!-- Row 2: ALL toggle + Apply button -->
              <div class="drawer-row">
                <div class="toggle-group" title="Process all open documents in Photoshop">
                  <span class="toggle-text">ALL</span>
                  <label class="switch">
                    <input type="checkbox" id="toggleShadowAll" />
                    <span class="slider"></span>
                  </label>
                </div>
                <button type="button" class="btn-apply-scsm" id="btnApplyShadow" style="flex: 1;">Apply</button>
              </div>
            </div>
          </div>

          <!-- Color Correction -->
          <button type="button" class="action-btn" id="btnColorCorrection">
            <span class="btn-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
            </span>
            <span class="btn-label" id="lblColorCorrection">Color Correction</span>
            <span class="btn-chevron" id="colorChevron"></span>
          </button>

          <!-- Color Correction Options Drawer (Dropdown) -->
          <div id="colorOptionsBox" class="custom-scsm-box drawer-mb" style="display: none;">
            <div class="drawer-content">
              <!-- Row 1: Dropdown -->
              <div class="custom-select-wrap">
                <select id="selectColorMethod" class="custom-select select-compact">
                  <option value="white_balance" selected>White Balance</option>
                  <option value="auto_color">Auto Color Correction</option>
                </select>
              </div>
              <!-- Row 2: ALL toggle + Apply button -->
              <div class="drawer-row">
                <div class="toggle-group" title="Process all open documents in Photoshop">
                  <span class="toggle-text">ALL</span>
                  <label class="switch">
                    <input type="checkbox" id="toggleColorAll" />
                    <span class="slider"></span>
                  </label>
                </div>
                <button type="button" class="btn-apply-scsm" id="btnApplyColor" style="flex: 1;">Apply</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 4. SCSM (Smart Crop / Centering & Sizing) -->
      <section class="accordion-item" id="sec-scsm">
        <div class="accordion-header" data-target="body-scsm">
          <span class="section-title">SCSM</span>
          <div class="section-line"></div>
          <div class="toggle-group" title="Process all open documents in Photoshop">
            <span class="toggle-text">ALL</span>
            <label class="switch">
              <input type="checkbox" id="toggleScsmAll" />
              <span class="slider"></span>
            </label>
          </div>
          <span class="chevron down"></span>
        </div>
        <div class="accordion-body" id="body-scsm">
          <div class="scsm-options-row">
            <button type="button" class="action-btn scsm-choice-btn" id="btnScsmProduct">
              <span class="btn-label-center">Product</span>
            </button>
            <button type="button" class="action-btn scsm-choice-btn" id="btnScsmModel">
              <span class="btn-label-center">Model</span>
            </button>
            <button type="button" class="action-btn scsm-choice-btn" id="btnScsmCustom">
              <span class="btn-label-center">Custom</span>
            </button>
          </div>

          <!-- Custom SCSM Drawer (Expands when Custom is clicked) -->
          <div id="customScsmBox" class="custom-scsm-box" style="display: none;">
            <div class="custom-scsm-row">
              <div class="scsm-input-wrap">
                <input type="number" id="inputScsmCustomPercent" value="10" min="1" max="45" placeholder="10" class="scsm-percent-input" />
                <span class="scsm-input-unit">% Margin</span>
              </div>
              <button type="button" class="btn-apply-scsm" id="btnApplyCustomScsm">Apply</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 5. EXPORT -->
      <section class="accordion-item" id="sec-export">
        <div class="accordion-header" data-target="body-export">
          <span class="section-title">EXPORT</span>
          <div class="section-line"></div>
          <span class="chevron down"></span>
        </div>
        <div class="accordion-body" id="body-export">

          <!-- Ready For Delivery -->
          <button type="button" class="action-btn" id="btnReadyDelivery">
            <span class="btn-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            </span>
            <span class="btn-label">Ready For Delivery</span>
            <span class="btn-chevron" id="deliveryChevron"></span>
          </button>

          <!-- Delivery Options Drawer -->
          <div id="deliveryOptionsBox" class="custom-scsm-box drawer-mb" style="display: none;">
            <div class="drawer-content">
              <!-- Row 1: Marketplace Select -->
              <div class="custom-select-wrap">
                <select id="selectDeliveryMarketplace" class="custom-select select-compact">
                  <option value="" disabled selected>Select Marketplace...</option>
                  <option value="amazon">Amazon</option>
                  <option value="ebay">eBay</option>
                  <option value="etsy">Etsy</option>
                  <option value="shopify">Shopify</option>
                  <option value="walmart">Walmart</option>
                  <option value="woocommerce">WooCommerce</option>
                  <option value="zalando">Zalando</option>
                  <option value="custom">Custom</option>
                </select>
              </div>

                            <!-- Custom Marketplace Settings Row (only visible when Custom selected) -->
              <div id="deliveryCustomRow" class="delivery-custom-row">
                <div class="field-group">
                  <span class="field-label">Max Size:</span>
                  <input type="number" id="inputDeliveryCustomMaxMb" value="10" min="0.1" max="100" step="0.5" class="field-input" />
                  <span class="field-unit">MB</span>
                </div>
                <div class="field-group">
                  <span class="field-label">Profile:</span>
                  <select id="selectDeliveryCustomProfile" class="custom-select field-select">
                    <option value="sRGB" selected>sRGB</option>
                    <option value="RGB">RGB</option>
                  </select>
                </div>
              </div>

              <!-- Row 2: Format Select & Auto Info Badges -->
              <div class="drawer-row">
                <div class="custom-select-wrap" style="margin-bottom: 0; flex: 1;">
                  <select id="selectDeliveryFormat" class="custom-select select-compact">
                    <option value="JPG" selected>JPG</option>
                    <option value="PNG">PNG</option>
                    <option value="WebP">WebP</option>
                  </select>
                </div>
                <!-- Info Badges -->
                <div class="info-badge">
                  <span id="lblDeliveryMaxSize" title="Maximum File Size Allowed">Max: 20 MB</span>
                  <span class="separator">|</span>
                  <span id="lblDeliveryColorProfile" title="Target Color Profile">sRGB</span>
                </div>
              </div>

              <!-- Row 3: ALL toggle + Export button -->
              <div class="drawer-row">
                <div class="toggle-group" title="Export all open documents in Photoshop">
                  <span class="toggle-text">ALL</span>
                  <label class="switch">
                    <input type="checkbox" id="toggleDeliveryAll" />
                    <span class="slider"></span>
                  </label>
                </div>
                <button type="button" class="btn-apply-scsm" id="btnExportDelivery" style="flex: 1;">Export</button>
              </div>
            </div>
          </div>

          <button class="action-btn" id="btnWorkingFile">
            <span class="btn-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            </span>
            <span class="btn-label">Working File (PSD)</span>
          </button>
        </div>
      </section>
    </div>

    <!-- Activity Status Footer with Compact Undo/Redo Icons -->
    <footer class="panel-footer">
      <div class="status-indicator">
        <span class="status-dot online"></span>
        <span class="status-msg" id="statusMsg">Ready</span>
      </div>

      <div class="history-btns-group">
          <button type="button" class="history-text-btn" id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
          <button type="button" class="history-text-btn" id="btnRedo" title="Redo (Ctrl+Y)">Redo</button>
        </div>
    </footer>
  </div>

  <script src="modules/ps_automation.js"></script>
  <script src="modules/adjustment.js"></script>
  <script src="main.js"></script>
</body>
</html>
